version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sentrix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-secure-password}
      POSTGRES_DB: ${POSTGRES_DB:-sentrix}
    ports:
      # Bind strictly to localhost loopback to prevent exposing database port to public network
      - "127.0.0.1:5432:5432"
    volumes:
      - sentrix_data:/var/lib/postgresql/data
      - ../../server/migrations:/docker-entrypoint-initdb.d # Auto-run migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sentrix_data:
