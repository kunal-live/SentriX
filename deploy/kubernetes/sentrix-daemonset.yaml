apiVersion: v1
kind: Namespace
metadata:
  name: sentrix-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentrix-k8s-collector
  namespace: sentrix-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentrix-k8s-collector
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/stats", "nodes/metrics", "services", "endpoints", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentrix-k8s-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentrix-k8s-collector
subjects:
  - kind: ServiceAccount
    name: sentrix-k8s-collector
    namespace: sentrix-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentrix-collector-config
  namespace: sentrix-system
data:
  collector.sh: |
    #!/bin/sh
    set -e
    SERVER_URL="${SENTRIX_SERVER_URL:-http://169.58.138.136:8080}"
    INTERVAL="${SCRAPE_INTERVAL:-15}"
    KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || echo "")

    echo "Starting SentriX Kubernetes Collector streaming to: ${SERVER_URL}"
    echo "Node name: ${NODE_NAME}"

    while true; do
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      
      # Query Kubelet summary or pods API
      if [ -n "$KUBE_TOKEN" ]; then
        PODS_JSON=$(curl -sSk -H "Authorization: Bearer $KUBE_TOKEN" "https://kubernetes.default.svc/api/v1/pods?fieldSelector=spec.nodeName=${NODE_NAME}" 2>/dev/null || echo '{"items":[]}')
        NODES_JSON=$(curl -sSk -H "Authorization: Bearer $KUBE_TOKEN" "https://kubernetes.default.svc/api/v1/nodes/${NODE_NAME}" 2>/dev/null || echo '{}')
        EVENTS_JSON=$(curl -sSk -H "Authorization: Bearer $KUBE_TOKEN" "https://kubernetes.default.svc/api/v1/events?limit=25" 2>/dev/null || echo '{"items":[]}')
      fi

      # Send telemetry payload to SentriX Server
      PAYLOAD=$(cat <<EOF
    {
      "cluster_name": "${CLUSTER_NAME:-production-k8s-cluster}",
      "version": "v1.29.2",
      "reporting_node": "${NODE_NAME}",
      "timestamp": "${TIMESTAMP}"
    }
    EOF
      )

      curl -s -X POST "${SERVER_URL}/api/v1/kubernetes/ingest" \
        -H "Content-Type: application/json" \
        -d "$PAYLOAD" >/dev/null 2>&1 || true

      sleep "$INTERVAL"
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentrix-agent-daemonset
  namespace: sentrix-system
  labels:
    app.kubernetes.io/name: sentrix-collector
    app.kubernetes.io/part-of: sentrix
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentrix-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentrix-collector
    spec:
      serviceAccountName: sentrix-k8s-collector
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: sentrix-collector
          image: curlimages/curl:8.6.0
          command: ["/bin/sh", "/scripts/collector.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SENTRIX_SERVER_URL
              value: "http://169.58.138.136:8080"
            - name: CLUSTER_NAME
              value: "production-k8s-cluster"
            - name: SCRAPE_INTERVAL
              value: "15"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
      volumes:
        - name: script-vol
          configMap:
            name: sentrix-collector-config
            defaultMode: 0755
        - name: var-log
          hostPath:
            path: /var/log
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
