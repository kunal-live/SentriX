name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Use the newest 1.26.x patch. go-version-file would pin the exact
          # go.mod version (1.26.0), and govulncheck fails on stdlib CVEs
          # that later patch releases fixed.
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Format check
        run: cd server && test -z "$(gofmt -l .)" || (echo "Unformatted Go code detected:" && gofmt -l . && exit 1)

      - name: Vet
        run: cd server && go vet ./...

      - name: Test
        run: cd server && go test -race ./...

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server && govulncheck ./...

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Security audit (npm audit)
        run: cd web && npm audit --audit-level=high

      - name: Build
        run: cd web && npm run build

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev

      - name: Verify vendored cJSON source integrity
        run: |
          test -f agent/src/core/cJSON.c || { echo "Missing vendored cJSON.c"; exit 1; }
          test -f agent/src/core/cJSON.h || { echo "Missing vendored cJSON.h"; exit 1; }

      - name: Configure agent with memory safety checks
        run: cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=ON

      - name: Build agent
        run: cmake --build agent/build --config Release

      - name: Smoke run agent under sanitizers
        run: ./agent/build/sentrix-agent --help
